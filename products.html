<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manage Products — DailyMart</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">DailyMart — Manage Products</div>
    <div class="right-controls">
      <a href="index.html" class="link">Back to POS</a>
      <a href="orders.html" class="link">Orders</a>
    </div>
  </header>

  <main style="max-width:1100px;margin:20px auto;padding:0 16px;">
    <div class="container-grid">
      <div class="card form-card">
        <h2 id="formTitle">Add Product</h2>
        <input id="pName" placeholder="Product name" />
        <input id="pPrice" type="number" step="0.01" placeholder="Price (e.g. 12.50)" />
        <input id="pCategory" placeholder="Category (e.g. Grocery)" />
        <input id="pImg" placeholder="Image path (optional) assets/images/..." />
        <div style="display:flex;gap:8px">
          <button id="saveProduct" class="btn primary" style="flex:1">Save</button>
          <button id="resetForm" class="btn secondary" style="flex:1">Reset</button>
        </div>
      </div>

      <div class="card table-card" style="min-height:280px;">
        <h2>Products</h2>
        <input id="searchProducts" placeholder="Search products..." />
        <div style="overflow:auto;max-height:520px;margin-top:10px">
          <table class="prod-table">
            <thead>
              <tr><th>Name</th><th>Price</th><th>Category</th><th>Actions</th></tr>
            </thead>
            <tbody id="productTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/admin.js"></script>
</body>
</html>
